services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: brandmonitor
      POSTGRES_USER: brandmonitor
      POSTGRES_PASSWORD: brandmonitor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandmonitor -d brandmonitor"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://brandmonitor:brandmonitor@db:5432/brandmonitor
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-change-this-secret-in-production}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
